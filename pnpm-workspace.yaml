packages:
  - "apps/*"
  - "packages/*"
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@swc/core"
  - "prisma"
  - "unrs-resolver"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  codebase-memory-mcp: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
